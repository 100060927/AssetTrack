{% extends "base.html" %}
{% block content %}
<div class="row spread"><h1>Notifications</h1>
  {% if unread_count %}<form method="post" action="{% url 'notifications_read_all' %}">{% csrf_token %}<button class="btn ghost">Mark all as read</button></form>{% endif %}</div>
{% if items %}
<div class="table-wrap"><table>
  {% for n in items %}
  <tr class="{% if not n.read %}unread{% endif %}"><td style="white-space:nowrap">{{ n.created_at|date:"d M H:i" }}</td><td>{{ n.message }}</td>
    <td><form method="post" action="{% url 'notification_open' n.pk %}">{% csrf_token %}<button class="btn small ghost">Open</button></form></td></tr>
  {% endfor %}
</table></div>
{% else %}<div class="card empty">No notifications.</div>{% endif %}
{% endblock %}
